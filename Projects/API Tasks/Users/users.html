<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <style>
    .row {
      display: flex;
      flex-wrap: wrap;
      box-sizing: border-box;
    }
    .col-md-3 {
      display: flex;
    }

    .row {
      display: flex;
      padding: 30px;
    }
    .col-md-6 {
      display: flex;
      padding: 50px;
    }
    span {
      font-size: 18px;
      font-weight: bold;
    }
    .card {
      /* width: 100%; */
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
  </style>
  <body>
    <div class="row" id="row"></div>
  </body>
  <script>
    function fetchdata(myobj) {
      var div = document.getElementById("row");
      for (data of myobj) {
        var address = `${data.address.street}, ${data.address.suite}, ${data.address.city}, ${data.address.zipcode}, ${data.address.geo.lat}, ${data.address.geo.lng}`;
        var company = `${data.company.name}, ${data.company.catchPhrase}, ${data.company.bs}`;
        var html = `<div class="col-md-6">
        <div class="card">
          <h2 class="ps-3 pt-3">${data.id}</h2>
          <div class="card-body">
            <h4 class="card-title">${data.name}</h4>
            <p>${data.username}</p>
            <p><span>Email : </span><a href="#">${data.email}</a></p>
            <p><span>Address : </span>${address}</p>
            <p><span>Phone No : </span>${data.phone}</p>
            <p><span>Website : </span><a href="#">${data.website}</a></p>
            <p><span>Company : </span>${company}</p>
          </div>
        </div>
      </div>`;
        div.insertAdjacentHTML("beforeend", html);
      }
    }

    fetch(`https://jsonplaceholder.typicode.com/users`)
      .then((res) => res.json())
      .then((obj) => fetchdata(obj));
  </script>
</html>
