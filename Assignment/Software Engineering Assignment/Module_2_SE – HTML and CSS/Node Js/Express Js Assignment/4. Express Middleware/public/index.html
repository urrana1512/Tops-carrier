<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingress Sentinel | Task 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #070708;
            --accent: #f97316;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 0% 0%, #2a1a0a 0%, #000 60%);
        }
        .container { width: 100%; max-width: 600px; text-align: center; }
        header { margin-bottom: 3.5rem; }
        .badge {
            display: inline-block;
            background: rgba(249, 115, 22, 0.1);
            color: var(--accent);
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            border: 1px solid rgba(249, 115, 22, 0.2);
            margin-bottom: 1rem;
        }
        h1 { font-size: 3rem; letter-spacing: -2px; }

        .sentinel-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 32px;
            backdrop-filter: blur(20px);
        }

        .action-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 2.5rem; }
        
        .btn-trigger {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            color: #fff;
            padding: 18px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .btn-trigger:hover { background: rgba(249, 115, 22, 0.1); border-color: var(--accent); transform: scale(1.02); }
        .btn-trigger i { color: var(--accent); font-size: 1.2rem; }
        .btn-trigger .method { color: var(--accent); font-weight: 700; margin-right: 10px; }

        #telemetryView {
            margin-top: 2rem;
            background: #000;
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #94a3b8;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry { margin-bottom: 6px; }
        .log-entry .ts { color: #444; margin-right: 8px; }
        .log-entry .cmd { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">MIDDLEWARE_SENTINEL // TELEMETRY_LOGGER</div>
            <h1>Ingress Sentinel</h1>
        </header>

        <section class="sentinel-card">
            <p>Trigger requests below and observe the terminal-side middleware telemetry.</p>
            
            <div class="action-list">
                <button class="btn-trigger" onclick="fire('/api/ping')">
                    <span><span class="method">GET</span> /api/ping</span>
                    <i class="ph-bold ph-broadcast"></i>
                </button>
                <button class="btn-trigger" onclick="fire('/api/data/secure')">
                    <span><span class="method">GET</span> /api/data/secure</span>
                    <i class="ph-bold ph-shield-check"></i>
                </button>
                <button class="btn-trigger" onclick="fire('/non-existent-path')">
                    <span><span class="method">GET</span> /undefined-route</span>
                    <i class="ph-bold ph-warning-circle"></i>
                </button>
            </div>

            <div id="telemetryView">
                <div class="log-entry">// Sentinel standing by for ingress signals...</div>
            </div>
        </section>
    </div>

    <script>
        const telemetryView = document.getElementById('telemetryView');

        const fire = async (url) => {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="ts">[${new Date().toLocaleTimeString()}]</span> Signal dispatched to <span class="cmd">${url}</span>...`;
            telemetryView.prepend(entry);
            
            try {
                await fetch(url);
            } catch (e) {
                // Silently handle errors
            }
        };
    </script>
</body>
</html>
