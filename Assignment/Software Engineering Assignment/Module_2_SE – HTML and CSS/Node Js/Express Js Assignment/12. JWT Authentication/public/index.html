<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Sentinel | Task 12</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #050507;
            --accent: #a855f7;
            --glass: rgba(168, 85, 247, 0.05);
            --border: rgba(168, 85, 247, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at bottom right, #3b0764 0%, #000 60%);
        }
        .container { width: 100%; max-width: 650px; text-align: center; }
        header { margin-bottom: 3rem; }
        .badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.1);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 3px;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        h1 { font-size: 3rem; letter-spacing: -2px; }

        .sentinel-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 40px;
            backdrop-filter: blur(20px);
            text-align: left;
        }

        .step { margin-bottom: 2.5rem; }
        .step-title { font-size: 0.75rem; font-weight: 800; color: #6b7280; letter-spacing: 2px; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
        .step-title i { color: var(--accent); }

        .input-row { display: flex; gap: 10px; }
        input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px;
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }
        input:focus { border-color: var(--accent); }

        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4); }

        .token-display {
            margin-top: 1rem;
            background: #000;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.7rem;
            color: #a855f7;
            word-break: break-all;
            border: 1px dashed var(--border);
            font-family: 'JetBrains Mono', monospace;
        }

        #protectedView {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 1.5rem;
            margin-top: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #d8b4fe;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">JWT_PROTOCOL // STATELESS_AUTH</div>
            <h1>Token Sentinel</h1>
        </header>

        <section class="sentinel-card">
            <!-- Step 1: Registration -->
            <div class="step">
                <div class="step-title"><i class="ph-bold ph-user-plus"></i> STEP_01: IDENTITY_REGISTRATION</div>
                <div class="input-row">
                    <input type="text" id="usernameInput" placeholder="New User Identity" value="Udit_Rana">
                    <button class="btn" onclick="registerUser()">ISSUE_JWT</button>
                </div>
                <div id="tokenContainer" class="token-display hidden"></div>
            </div>

            <!-- Step 2: Protected Access -->
            <div class="step">
                <div class="step-title"><i class="ph-bold ph-shield-star"></i> STEP_02: SECURE_RESOURCE_ACCESS</div>
                <button class="btn" style="width: 100%; height: 50px;" onclick="accessProtected()">
                    <i class="ph-bold ph-lock-key-open"></i> DECRYPT_PROTECTED_VAULT
                </button>
                <div id="protectedView" class="hidden"></div>
            </div>
        </section>
    </div>

    <script>
        let currentToken = "";

        const registerUser = async () => {
            const username = document.getElementById('usernameInput').value;
            if (!username) return;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const data = await res.json();

            if (data.token) {
                currentToken = data.token;
                const container = document.getElementById('tokenContainer');
                container.classList.remove('hidden');
                container.innerText = data.token;
            }
        };

        const accessProtected = async () => {
            const view = document.getElementById('protectedView');
            view.classList.remove('hidden');
            view.innerText = "// Attempting handshake...";

            try {
                const res = await fetch('/api/protected', {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();

                if (res.ok) {
                    view.style.color = "#d8b4fe";
                    view.innerHTML = `<div>> STATUS: ${data.status}</div><div>> USER: ${data.authorized_user}</div><div>> INTEL: ${data.intel}</div>`;
                } else {
                    view.style.color = "#ef4444";
                    view.innerText = `// ACCESS_DENIED: ${data.message}`;
                }
            } catch (e) {
                view.innerText = "// Network Interruption.";
            }
        };
    </script>
</body>
</html>
