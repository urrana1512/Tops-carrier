<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Failure Sentinel | Task 8</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #09090b;
            --accent: #ef4444;
            --glass: rgba(39, 39, 42, 0.4);
            --border: rgba(239, 68, 68, 0.2);
            --text: #a1a1aa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at center, #1a0a0a 0%, #000 100%);
        }
        .container { width: 100%; max-width: 600px; text-align: center; }
        header { margin-bottom: 3.5rem; }
        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 3px;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        h1 { font-size: 3rem; color: #fff; letter-spacing: -2px; }

        .sentinel-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 32px;
            backdrop-filter: blur(20px);
        }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem; }
        
        .btn-action {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 20px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: 0.3s;
        }

        .btn-action:hover { background: rgba(255, 255, 255, 0.05); transform: translateY(-5px); }
        .btn-action.fault:hover { border-color: var(--accent); background: rgba(239, 68, 68, 0.1); }
        
        .btn-action i { font-size: 2rem; }
        .btn-action.fault i { color: var(--accent); }
        .btn-action span { font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; }

        #responseArea {
            margin-top: 2rem;
            background: #000;
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #6ee7b7;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">SYSTEM_RESILIENCE // ERROR_SENTINEL</div>
            <h1>Failure Sentinel</h1>
        </header>

        <section class="sentinel-card">
            <p>Inject a fault into the system to verify the interception logic of the Failure Sentinel.</p>
            
            <div class="action-grid">
                <button class="btn-action" onclick="fetchHealth()">
                    <i class="ph-bold ph-heartbeat" style="color: #4ade80;"></i>
                    <span>PING_HEALTH</span>
                </button>
                <button class="btn-action fault" onclick="injectFault()">
                    <i class="ph-bold ph-warning-octagon"></i>
                    <span>INJECT_FAULT</span>
                </button>
            </div>

            <div id="responseArea" class="hidden"></div>
        </section>
    </div>

    <script>
        const respArea = document.getElementById('responseArea');

        const fetchHealth = async () => {
            respArea.classList.remove('hidden');
            respArea.style.color = "#4ade80";
            respArea.innerText = "// Requesting core health status...";
            
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                respArea.innerText = JSON.stringify(data, null, 2);
            } catch (e) {
                respArea.innerText = "// Link Severed.";
            }
        };

        const injectFault = async () => {
            respArea.classList.remove('hidden');
            respArea.style.color = "#fca5a5";
            respArea.innerText = "// Injecting server-side fault...";
            
            try {
                const res = await fetch('/api/trigger-fault');
                const data = await res.json();
                respArea.innerText = JSON.stringify(data, null, 2);
            } catch (e) {
                respArea.innerText = "// Fault Captured: Server returned error status.";
            }
        };
    </script>
</body>
</html>
