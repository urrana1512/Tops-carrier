<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Intake | Task 6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #10b981;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 0% 100%, #064e3b 0%, #000 40%);
        }
        .container { width: 100%; max-width: 500px; text-align: center; }
        header { margin-bottom: 3rem; }
        .badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 3px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            margin-bottom: 1rem;
        }
        h1 { font-size: 2.5rem; letter-spacing: -1px; }

        .form-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 40px;
            backdrop-filter: blur(20px);
            text-align: left;
        }

        .input-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; letter-spacing: 1px; margin-bottom: 8px; }
        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.05); }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #064e3b;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            margin-top: 1rem;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); }

        footer { margin-top: 2rem; color: #444; font-size: 0.7rem; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">IDENTITY_INTAKE // POST_PROTOCOL</div>
            <h1>Identity Portal</h1>
        </header>

        <section class="form-card">
            <!-- Requirement: Set the form method to POST and action to /submit -->
            <form action="/submit" method="POST">
                <div class="input-group">
                    <label>LEGAL_IDENTITY (NAME)</label>
                    <input type="text" name="name" placeholder="e.g. Udit Rana" required>
                </div>
                <div class="input-group">
                    <label>NETWORK_ALIAS (EMAIL)</label>
                    <input type="email" name="email" placeholder="udit@express.dev" required>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="ph-bold ph-arrow-right"></i>
                    COMMENCE_INTAKE
                </button>
            </form>
        </section>

        <footer>ENCRYPTED_TUNNEL: PORT_3005</footer>
    </div>
</body>
</html>
