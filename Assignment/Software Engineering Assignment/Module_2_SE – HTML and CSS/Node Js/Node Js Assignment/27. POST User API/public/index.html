<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Portal | Task 27</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #8b5cf6;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .container { width: 100%; max-width: 500px; }
        header { text-align: center; margin-bottom: 3rem; }
        .badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; }

        .form-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 32px;
            backdrop-filter: blur(20px);
            margin-bottom: 2rem;
        }

        .input-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; letter-spacing: 1px; margin-bottom: 8px; }
        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.05); }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); }

        .response-card {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            animation: slideUp 0.5s ease-out;
        }
        .response-card h3 { font-size: 0.8rem; color: var(--accent); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
        pre { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #94a3b8; line-height: 1.6; white-space: pre-wrap; }

        .hidden { display: none; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">HTTP_POST // JSON_PARSER</div>
            <h1>Registration Portal</h1>
        </header>

        <section class="form-card">
            <form id="regForm">
                <div class="input-group">
                    <label>CORE IDENTITY (NAME)</label>
                    <input type="text" id="name" placeholder="e.g. Udit Rana" required>
                </div>
                <div class="input-group">
                    <label>NETWORK ADDRESS (EMAIL)</label>
                    <input type="email" id="email" placeholder="udit@nexus.dev" required>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="ph-bold ph-paper-plane-right"></i>
                    DISPATCH IDENTITY
                </button>
            </form>
        </section>

        <section id="responseView" class="response-card hidden">
            <h3><i class="ph-fill ph-check-circle"></i> SYSTEM_ECHO</h3>
            <pre id="jsonResponse"></pre>
        </section>
    </div>

    <script>
        const form = document.getElementById('regForm');
        const responseView = document.getElementById('responseView');
        const jsonResponse = document.getElementById('jsonResponse');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const userData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value
            };

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                const result = await response.json();

                jsonResponse.innerText = JSON.stringify(result, null, 2);
                responseView.classList.remove('hidden');
                form.reset();
            } catch (error) {
                alert("Identity dispatch failed.");
            }
        };
    </script>
</body>
</html>
