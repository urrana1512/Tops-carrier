<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Stream | API Pagination</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-decor"></div>
    
    <main class="container">
        <header>
            <h1>Post Stream</h1>
            <p>Navigating API datasets with precision</p>
        </header>

        <section id="postsContainer" class="posts-grid">
            <!-- Posts will be injected here -->
            <div class="loader">Fetching data...</div>
        </section>

        <!-- Task 16 Requirement: Next and Previous buttons -->
        <nav class="pagination-dock">
            <button id="prevBtn" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                Previous
            </button>
            <div class="page-indicator">
                Page <span id="pageNumber">1</span>
            </div>
            <button id="nextBtn">
                Next
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </nav>
    </main>

    <script>
        const postsContainer = document.getElementById('postsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageNumber = document.getElementById('pageNumber');

        let currentPage = 1;
        const limit = 5; // Task 16 Requirement: 5 posts at a time

        async function fetchPosts(page) {
            postsContainer.innerHTML = '<div class="loader">Synchronizing stream...</div>';
            
            try {
                // Task 16 Requirement: Fetch from JSONPlaceholder API with pagination
                const response = await fetch(`https://jsonplaceholder.typicode.com/posts?_page=${page}&_limit=${limit}`);
                const posts = await response.json();

                renderPosts(posts);
                updatePagination(posts.length);
            } catch (error) {
                postsContainer.innerHTML = '<div class="error">System error: Unable to reach data stream.</div>';
            }
        }

        function renderPosts(posts) {
            postsContainer.innerHTML = '';
            posts.forEach((post, index) => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.innerHTML = `
                    <div class="post-id">#${post.id}</div>
                    <h3>${post.title}</h3>
                    <p>${post.body}</p>
                `;
                postsContainer.appendChild(card);
            });
        }

        function updatePagination(postsCount) {
            pageNumber.innerText = currentPage;
            prevBtn.disabled = (currentPage === 1);
            // JSONPlaceholder has 100 posts, so max page is 20 with limit 5
            nextBtn.disabled = (postsCount < limit || currentPage === 20);
        }

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                fetchPosts(currentPage);
            }
        });

        nextBtn.addEventListener('click', () => {
            currentPage++;
            fetchPosts(currentPage);
        });

        // Initial Load
        fetchPosts(currentPage);
    </script>
</body>
</html>
