<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Repository | Task 26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #0b0c10;
            --accent: #66fcf1;
            --glass: rgba(31, 40, 51, 0.4);
            --border: rgba(102, 252, 241, 0.2);
            --text: #c5c6c7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 4rem 1.5rem;
        }
        .container { width: 100%; max-width: 800px; }
        header { text-align: center; margin-bottom: 4rem; }
        .badge {
            display: inline-block;
            background: rgba(102, 252, 241, 0.05);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 3.5rem; color: #fff; letter-spacing: -2px; }

        .api-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 3rem;
            backdrop-filter: blur(20px);
        }

        .controls { display: flex; justify-content: center; margin-bottom: 2.5rem; }
        .btn-fetch {
            background: var(--accent);
            color: #0b0c10;
            border: none;
            padding: 18px 36px;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-fetch:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(102, 252, 241, 0.3); }

        .table-container {
            overflow-x: auto;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 1.5rem; font-size: 0.7rem; color: #45a29e; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        td { padding: 1.5rem; font-size: 0.95rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        tr:last-child td { border-bottom: none; }
        
        .status-pill {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .active { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .away { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .offline { background: rgba(100, 116, 139, 0.1); color: #64748b; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">HTTP_GET // JSON_REGISTRY</div>
            <h1>User Repository</h1>
        </header>

        <section class="api-card">
            <div class="controls">
                <button id="fetchBtn" class="btn-fetch">
                    <i class="ph-bold ph-lightning"></i>
                    FETCH DATA_STREAM
                </button>
            </div>

            <div id="resultArea" class="table-container hidden">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Identity</th>
                            <th>Core Role</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="userTable"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        const fetchBtn = document.getElementById('fetchBtn');
        const resultArea = document.getElementById('resultArea');
        const userTable = document.getElementById('userTable');

        fetchBtn.onclick = async () => {
            fetchBtn.disabled = true;
            fetchBtn.innerHTML = '<i class="ph ph-circle-notch spin"></i> <span>Querying Registry...</span>';
            
            try {
                const response = await fetch('/api/users');
                const users = await response.json();

                userTable.innerHTML = '';
                users.forEach(user => {
                    const statusClass = user.status.toLowerCase();
                    userTable.innerHTML += `
                        <tr>
                            <td style="font-family: 'Space Grotesk'; font-weight: 700;">#${user.id}</td>
                            <td style="color: #fff; font-weight: 600;">${user.name}</td>
                            <td style="color: #45a29e;">${user.role}</td>
                            <td><span class="status-pill ${statusClass}">${user.status}</span></td>
                        </tr>
                    `;
                });

                resultArea.classList.remove('hidden');
            } catch (error) {
                console.error("API link severed.");
            } finally {
                fetchBtn.innerHTML = '<i class="ph-bold ph-check"></i> <span>Data Retreived</span>';
                setTimeout(() => {
                    fetchBtn.innerHTML = '<i class="ph-bold ph-lightning"></i> FETCH DATA_STREAM';
                    fetchBtn.disabled = false;
                }, 2000);
            }
        };
    </script>
</body>
</html>
