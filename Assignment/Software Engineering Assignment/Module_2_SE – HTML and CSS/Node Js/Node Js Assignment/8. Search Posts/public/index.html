<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Search Engine | Task 08</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>
    
    <main class="container">
        <header>
            <div class="badge">Dynamic Querying</div>
            <h1>Search Posts</h1>
            <p>Filter blog posts by entering a specific User ID (e.g., 1 to 10).</p>
        </header>

        <section class="search-section">
            <div class="search-box glass">
                <input type="number" id="userIdInput" placeholder="Enter User ID (1-10)" min="1" max="10">
                <button id="searchBtn" class="search-btn">
                    <span>Search</span>
                </button>
            </div>
        </section>

        <div id="results" class="results-container">
            <div class="empty-state">Results will appear here...</div>
        </div>

        <footer class="footer">
            Node.js Search Functionality Assignment
        </footer>
    </main>

    <script>
        const searchBtn = document.getElementById('searchBtn');
        const userIdInput = document.getElementById('userIdInput');
        const resultsContainer = document.getElementById('results');

        async function fetchPostsByUserId() {
            const userId = userIdInput.value;
            
            if (!userId) {
                alert("Please enter a User ID");
                return;
            }

            resultsContainer.innerHTML = '<div class="loader">Querying API...</div>';

            try {
                // Task 8 Requirement: Fetch data based on user input
                const response = await fetch(`https://jsonplaceholder.typicode.com/posts?userId=${userId}`);
                const posts = await response.json();

                resultsContainer.innerHTML = '';

                if (posts.length === 0) {
                    resultsContainer.innerHTML = '<div class="empty-state">No posts found for this ID.</div>';
                    return;
                }

                // Task 8 Requirement: Display filtered results
                posts.forEach(post => {
                    const postCard = document.createElement('div');
                    postCard.className = 'post-card glass';
                    postCard.innerHTML = `
                        <div class="card-id">Post #${post.id}</div>
                        <h3>${post.title}</h3>
                        <p>${post.body}</p>
                    `;
                    resultsContainer.appendChild(postCard);
                });

            } catch (error) {
                console.error("Search error:", error);
                resultsContainer.innerHTML = '<div class="error">Search failed. Check your connection.</div>';
            }
        }

        searchBtn.addEventListener('click', fetchPostsByUserId);
        
        // Allow Enter key to trigger search
        userIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchPostsByUserId();
        });
    </script>
</body>
</html>
