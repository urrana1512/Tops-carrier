<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Scanner | Task 22.5</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Outfit:wght@300;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="radar-bg"></div>

    <main class="container">
        <header>
            <div class="badge">FS.SPLIT('\N')</div>
            <h1>Sequential Line Scanner</h1>
            <p>Iterating through digital segments one by one</p>
        </header>

        <section class="scanner-card glass">
            <div class="scanner-header">
                <div class="status-indicator">
                    <span class="pulse"></span>
                    ACTIVE_SCAN
                </div>
                <div id="lineCount" class="counter">08 Lines Detected</div>
            </div>

            <div id="lineList" class="line-list">
                <!-- Lines will be injected here -->
            </div>
            
            <button id="scanBtn" class="scan-btn">
                <i class="ph-bold ph-radar"></i>
                <span>Initiate Sequence</span>
            </button>
        </section>

        <footer>
            <p>Results are simultaneously printed to the <strong>Node.js Console</strong>.</p>
        </footer>
    </main>

    <script>
        const scanBtn = document.getElementById('scanBtn');
        const lineList = document.getElementById('lineList');

        async function startScan() {
            scanBtn.disabled = true;
            lineList.innerHTML = "";
            
            try {
                const response = await fetch('/api/scan-lines');
                const { lines } = await response.json();

                for (let i = 0; i < lines.length; i++) {
                    // Artificial delay to visualize the loop
                    await new Promise(r => setTimeout(r, 400));
                    
                    const div = document.createElement('div');
                    div.className = 'line-item';
                    div.innerHTML = `
                        <span class="index">#${String(i + 1).padStart(2, '0')}</span>
                        <span class="content">${lines[i]}</span>
                    `;
                    lineList.appendChild(div);
                    div.scrollIntoView({ behavior: 'smooth' });
                }
            } catch (error) {
                lineList.innerHTML = "<p class='error'>Scan Interrupted.</p>";
            } finally {
                scanBtn.innerHTML = '<span>Scan Complete</span>';
            }
        }

        scanBtn.onclick = startScan;
    </script>
</body>
</html>
