<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Orchestrator | Task 25</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --accent: #f43f5e;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { width: 100%; max-width: 600px; text-align: center; padding: 2rem; }
        header h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 0.5rem; }
        header p { color: #64748b; margin-bottom: 3rem; }

        .route-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .route-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 2rem 1rem;
            border-radius: 24px;
            text-decoration: none;
            color: #fff;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .route-card:hover {
            transform: translateY(-10px);
            background: rgba(244, 63, 94, 0.1);
            border-color: var(--accent);
        }

        .route-card i { font-size: 2.5rem; color: var(--accent); }
        .route-card span { font-weight: 700; font-size: 0.9rem; letter-spacing: 1px; }

        .console-view {
            background: #000;
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .console-header {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.r { background: #ff5f56; }
        .dot.y { background: #ffbd2e; }
        .dot.g { background: #27c93f; }

        pre { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #94a3b8; }
        .cmd { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome!</h1>
            <p>You are currently at the Home Page endpoint.</p>
        </header>

        <nav class="route-grid">
            <a href="/" class="route-card">
                <i class="ph-fill ph-house"></i>
                <span>HOME</span>
            </a>
            <a href="/about" class="route-card">
                <i class="ph-fill ph-identification-card"></i>
                <span>ABOUT</span>
            </a>
            <a href="/contact" class="route-card">
                <i class="ph-fill ph-envelope"></i>
                <span>CONTACT</span>
            </a>
        </nav>

        <div class="console-view">
            <div class="console-header">
                <div class="dot r"></div>
                <div class="dot y"></div>
                <div class="dot g"></div>
            </div>
            <pre><span class="cmd">node orchestrator.js</span><br>// Awaiting traffic...<br>// Click a route to trigger a server-side redirect.</pre>
        </div>
    </div>
</body>
</html>
