<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Management Console | Task 12</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    
    <main class="container">
        <header>
            <div class="chip">HTTP DELETE Implementation</div>
            <h1>Manage Resources</h1>
            <p>Remove posts directly from the JSONPlaceholder API.</p>
        </header>

        <section id="postList" class="post-list">
            <div class="loader">Initializing system...</div>
        </section>

        <div id="confirmationToast" class="toast hidden">
            <span class="icon">✅</span>
            <span id="toastMsg">Post successfully deleted.</span>
        </div>

        <footer class="footer">
            Final Node.js Assignment | DELETE Request
        </footer>
    </main>

    <script>
        const postList = document.getElementById('postList');
        const toast = document.getElementById('confirmationToast');
        const toastMsg = document.getElementById('toastMsg');

        let posts = [];

        async function fetchPosts() {
            try {
                const res = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');
                posts = await res.json();
                renderPosts();
            } catch (err) {
                postList.innerHTML = '<div class="error">System Error: Failed to fetch posts.</div>';
            }
        }

        function renderPosts() {
            postList.innerHTML = '';
            if (posts.length === 0) {
                postList.innerHTML = '<div class="empty">All resources have been removed.</div>';
                return;
            }

            posts.forEach(post => {
                const div = document.createElement('div');
                div.className = 'post-card glass';
                div.id = `post-${post.id}`;
                div.innerHTML = `
                    <div class="card-content">
                        <div class="post-id">Resource #${post.id}</div>
                        <h3>${post.title}</h3>
                    </div>
                    <button class="delete-btn" onclick="deletePost(${post.id})">
                        <span>Remove</span>
                    </button>
                `;
                postList.appendChild(div);
            });
        }

        async function deletePost(id) {
            if (!confirm("Are you sure you want to remove this resource?")) return;

            const btn = document.querySelector(`#post-${id} .delete-btn`);
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                // Task 12 Requirement: Send a DELETE request
                const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${id}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    // Task 12 Requirement: Log a confirmation message to the console
                    console.log(`%c [Task 12] Confirmation: Post with ID ${id} has been deleted.`, 'color: #ef4444; font-weight: bold;');
                    console.log('Server Response Status:', response.status);

                    // Task 12 Requirement: Display the updated list of posts after deletion
                    const element = document.getElementById(`post-${id}`);
                    element.style.animation = 'fadeOut 0.5s ease forwards';
                    
                    setTimeout(() => {
                        posts = posts.filter(p => p.id !== id);
                        renderPosts();
                        showToast(`Resource #${id} successfully removed.`);
                    }, 500);
                }
            } catch (err) {
                console.error("Delete Error:", err);
                alert("Failed to delete. Resource might not exist or network is down.");
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function showToast(msg) {
            toastMsg.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        fetchPosts();
    </script>
</body>
</html>
