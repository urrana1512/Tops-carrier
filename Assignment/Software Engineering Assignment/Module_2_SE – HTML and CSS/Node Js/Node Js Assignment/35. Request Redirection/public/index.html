<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Migrator | Task 35</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #09090b;
            --accent: #3b82f6;
            --glass: rgba(39, 39, 42, 0.4);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .container { width: 100%; max-width: 600px; text-align: center; }
        header { margin-bottom: 3.5rem; }
        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 3rem; color: #fff; letter-spacing: -2px; }

        .migrator-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 32px;
            backdrop-filter: blur(20px);
        }

        .flow {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 2rem 0;
        }
        .path {
            background: #000;
            padding: 15px 25px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }
        .arrow { font-size: 1.5rem; color: var(--accent); }

        .btn-test {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 18px 36px;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.3s;
            margin: 0 auto;
        }

        .btn-test:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }
        .note { margin-top: 2rem; font-size: 0.75rem; color: #52525b; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">TRAFFIC_CONTROL // REDIRECT_301</div>
            <h1>Path Migrator</h1>
        </header>

        <section class="migrator-card">
            <p>Initiate a handshake with a decommissioned endpoint to test the 301 redirection logic.</p>
            
            <div class="flow">
                <div class="path" style="color: #ef4444;">/old-url</div>
                <div class="arrow"><i class="ph-bold ph-arrow-right"></i></div>
                <div class="path" style="color: #10b981;">/new-url</div>
            </div>

            <button class="btn-test" onclick="window.location.href='/old-url'">
                <i class="ph-bold ph-lightning"></i>
                TEST REDIRECTION
            </button>

            <div class="note">
                // Logic: Server intercepts /old-url ➔ Sets Status 301 ➔ Sets Location Header ➔ Browser auto-reroutes.
            </div>
        </section>
    </div>
</body>
</html>
