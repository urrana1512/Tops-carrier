<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal | Form Validation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="mesh-bg"></div>

    <main class="container">
        <div class="form-card glass">
            <header>
                <div class="icon-circle">
                    <i class="ph-fill ph-shield-check"></i>
                </div>
                <h1>System Access</h1>
                <p>Complete verification to proceed</p>
            </header>

            <!-- Task 19 Requirement: Create a form to collect user data -->
            <form id="registrationForm" novalidate>
                <div class="input-group" id="nameGroup">
                    <label for="userName">Full Name</label>
                    <div class="input-wrapper">
                        <i class="ph ph-user"></i>
                        <input type="text" id="userName" placeholder="e.g. John Doe">
                    </div>
                    <span class="error-msg" id="nameError">Name is required</span>
                </div>

                <div class="input-group" id="emailGroup">
                    <label for="userEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="ph ph-envelope"></i>
                        <input type="email" id="userEmail" placeholder="john@example.com">
                    </div>
                    <span class="error-msg" id="emailError">Valid email is required</span>
                </div>

                <button type="submit" id="submitBtn">
                    <span>Initiate Registration</span>
                    <i class="ph-bold ph-arrow-right"></i>
                </button>
            </form>

            <div id="statusArea" class="status-area hidden">
                <div class="spinner"></div>
                <p>Verifying credentials...</p>
            </div>

            <div id="successMsg" class="success-banner hidden">
                <i class="ph-fill ph-check-circle"></i>
                <div>
                    <strong>Registration Successful</strong>
                    <p id="responseLog">Server ID: #201</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('registrationForm');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');
        const statusArea = document.getElementById('statusArea');
        const successMsg = document.getElementById('successMsg');
        const responseLog = document.getElementById('responseLog');

        // Task 19 Requirement: Implement form validation before making an API call
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset states
            resetValidation();
            let isValid = true;

            // Task 19 Requirement: Validate form input (ensure fields are not empty)
            if (!userName.value.trim()) {
                showError('nameGroup');
                isValid = false;
            }

            if (!userEmail.value.trim() || !userEmail.value.includes('@')) {
                showError('emailGroup');
                isValid = false;
            }

            if (!isValid) return; // Stop if validation fails

            // Proceed with API Call
            startLoading();

            try {
                // Task 19 Requirement: POST request to JSONPlaceholder
                const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: userName.value,
                        email: userEmail.value,
                        userId: 1
                    }),
                    headers: {
                        'Content-type': 'application/json; charset=UTF-8',
                    },
                });

                const data = await response.json();
                console.log("[Task 19] API Response:", data);
                
                showSuccess(data.id);

            } catch (error) {
                alert("Network error. Please try again later.");
                stopLoading();
            }
        });

        function showError(groupId) {
            document.getElementById(groupId).classList.add('has-error');
        }

        function resetValidation() {
            document.querySelectorAll('.input-group').forEach(g => g.classList.remove('has-error'));
            successMsg.classList.add('hidden');
        }

        function startLoading() {
            form.classList.add('hidden');
            statusArea.classList.remove('hidden');
        }

        function stopLoading() {
            form.classList.remove('hidden');
            statusArea.classList.add('hidden');
        }

        function showSuccess(id) {
            statusArea.classList.add('hidden');
            successMsg.classList.remove('hidden');
            responseLog.innerText = `Server ID Generated: #${id}`;
            form.reset();
            
            // Re-show form after 3 seconds
            setTimeout(() => {
                successMsg.classList.add('hidden');
                form.classList.remove('hidden');
            }, 4000);
        }
    </script>
</body>
</html>
