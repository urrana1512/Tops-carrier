<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Showcase | Task 07</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="blob-bg"></div>
    
    <main class="container">
        <header>
            <div class="status-chip">Dynamic Loop Implementation</div>
            <h1>Article Showcase</h1>
            <p>Fetching and rendering data from JSONPlaceholder.</p>
        </header>

        <!-- Core Requirement: <div> to display the data -->
        <div id="contentDisplay" class="content-display">
            <div class="placeholder-text">Initializing connection to API...</div>
        </div>

        <footer class="footer">
            Built with Professional Node.js Standards
        </footer>
    </main>

    <script>
        /**
         * Task 7 Core: Fetch and Loop Logic
         */
        async function displayData() {
            const container = document.getElementById('contentDisplay');
            
            try {
                // Fetching data
                const response = await fetch('https://jsonplaceholder.typicode.com/posts');
                const posts = await response.json();
                
                // Clear the container
                container.innerHTML = '';

                // Looping through response and creating HTML elements
                posts.slice(0, 10).forEach(post => {
                    const postElement = document.createElement('div');
                    postElement.className = 'post-item';
                    
                    postElement.innerHTML = `
                        <div class="post-id">Post #${post.id}</div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-body">${post.body}</p>
                    `;
                    
                    container.appendChild(postElement);
                });

            } catch (error) {
                console.error("Fetch error:", error);
                container.innerHTML = '<div class="error">Failed to load content.</div>';
            }
        }

        // Run the display function
        displayData();
    </script>
</body>
</html>
