<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Creator | Task 10</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>
    
    <main class="container">
        <header>
            <div class="badge">API Write Operation</div>
            <h1>Content Creator</h1>
            <p>Publish new posts to the JSONPlaceholder database.</p>
        </header>

        <section class="creation-grid">
            <!-- Task 10 Requirement: Create a form to collect user input -->
            <form id="postForm" class="glass-form">
                <div class="field">
                    <label>Article Title</label>
                    <input type="text" id="title" placeholder="Enter a catchy title..." required>
                </div>
                <div class="field">
                    <label>Article Content</label>
                    <textarea id="body" placeholder="Write your content here..." required></textarea>
                </div>
                <button type="submit" id="submitBtn" class="submit-btn">Publish Post</button>
            </form>

            <!-- Task 10 Requirement: Display the response (created post) -->
            <div id="previewArea" class="preview-area hidden">
                <div class="preview-header">
                    <span>Server Response</span>
                    <div class="success-dot"></div>
                </div>
                <div class="preview-card">
                    <div class="post-id-tag" id="resId">ID: --</div>
                    <h2 id="resTitle">Title will appear here</h2>
                    <p id="resBody">Body will appear here...</p>
                </div>
            </div>
        </section>

        <footer class="footer">
            Final Task | Module 2 Node.js Assignments
        </footer>
    </main>

    <script>
        const postForm = document.getElementById('postForm');
        const submitBtn = document.getElementById('submitBtn');
        const previewArea = document.getElementById('previewArea');
        const resId = document.getElementById('resId');
        const resTitle = document.getElementById('resTitle');
        const resBody = document.getElementById('resBody');

        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const body = document.getElementById('body').value;

            submitBtn.innerText = 'Publishing...';
            submitBtn.disabled = true;

            try {
                // Task 10 Requirement: Fetch API to send a POST request
                const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
                    method: 'POST',
                    body: JSON.stringify({
                        title: title,
                        body: body,
                        userId: 1,
                    }),
                    headers: {
                        'Content-type': 'application/json; charset=UTF-8',
                    },
                });

                const data = await response.json();

                // Task 10 Requirement: Display the created post on the web page
                resId.innerText = `System ID: ${data.id}`;
                resTitle.innerText = data.title;
                resBody.innerText = data.body;
                
                previewArea.classList.remove('hidden');
                previewArea.style.animation = 'slideIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
                
                submitBtn.innerText = 'Publish Another';
                submitBtn.disabled = false;
                postForm.reset();

            } catch (err) {
                console.error("POST Error:", err);
                alert("Failed to create post. Check console.");
                submitBtn.innerText = 'Publish Post';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
