<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Module Engine | Task 04</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="circles-bg">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
    </div>

    <main class="container">
        <div class="app-card">
            <header>
                <div class="label">System Modules v1.0</div>
                <h1>Math Engine</h1>
                <p>Functions imported from <code>mathUtils.js</code></p>
            </header>

            <div class="calc-grid">
                <div class="input-group">
                    <label>Value A</label>
                    <input type="number" id="numA" value="10">
                </div>
                <div class="input-group">
                    <label>Value B</label>
                    <input type="number" id="numB" value="5">
                </div>
            </div>

            <div class="ops-grid">
                <button class="op-btn" data-op="add">Add</button>
                <button class="op-btn" data-op="subtract">Subtract</button>
                <button class="op-btn" data-op="multiply">Multiply</button>
                <button class="op-btn" data-op="divide">Divide</button>
            </div>

            <div class="result-display">
                <div class="res-label">Engine Output</div>
                <div id="res-val" class="res-val">--</div>
            </div>
        </div>
    </main>

    <script>
        const buttons = document.querySelectorAll('.op-btn');
        const numA = document.getElementById('numA');
        const numB = document.getElementById('numB');
        const resVal = document.getElementById('res-val');

        buttons.forEach(btn => {
            btn.addEventListener('click', async () => {
                const operation = btn.getAttribute('data-op');
                const a = numA.value;
                const b = numB.value;

                try {
                    const response = await fetch('/api/calculate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ a, b, operation })
                    });
                    const data = await response.json();
                    resVal.innerText = data.result;
                    
                    // Add simple animation
                    resVal.style.animation = 'none';
                    resVal.offsetHeight; /* trigger reflow */
                    resVal.style.animation = 'pop 0.3s ease-out';
                } catch (err) {
                    console.error(err);
                }
            });
        });
    </script>
</body>
</html>
