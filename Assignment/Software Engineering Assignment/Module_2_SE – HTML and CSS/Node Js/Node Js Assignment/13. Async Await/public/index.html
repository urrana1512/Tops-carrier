<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async User Voyager | Task 13</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-sphere"></div>
    
    <main class="container">
        <header>
            <div class="badge">Modern Async Pattern</div>
            <h1>User Voyager</h1>
            <p>Handling API promises with the elegant <code>async/await</code> syntax.</p>
        </header>

        <section class="voyager-panel">
            <div class="control-box glass">
                <button id="fetchBtn" class="primary-btn">Initialize Async Fetch</button>
                <div class="hint">Check console for raw data logging</div>
            </div>

            <div id="outputArea" class="output-area hidden">
                <div class="user-profile-card">
                    <div class="profile-header">
                        <div class="avatar" id="avatar">?</div>
                        <div class="titles">
                            <h2 id="userName">Full Name</h2>
                            <span id="userHandle">@handle</span>
                        </div>
                    </div>
                    <div class="profile-details">
                        <div class="detail-item">
                            <label>Email</label>
                            <span id="userEmail">--</span>
                        </div>
                        <div class="detail-item">
                            <label>Company</label>
                            <span id="userCompany">--</span>
                        </div>
                        <div class="detail-item">
                            <label>Website</label>
                            <span id="userWebsite">--</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="footer">
            Final Node.js Practical | Async/Await Implementation
        </footer>
    </main>

    <script>
        const fetchBtn = document.getElementById('fetchBtn');
        const outputArea = document.getElementById('outputArea');
        const avatar = document.getElementById('avatar');
        const userName = document.getElementById('userName');
        const userHandle = document.getElementById('userHandle');
        const userEmail = document.getElementById('userEmail');
        const userCompany = document.getElementById('userCompany');
        const userWebsite = document.getElementById('userWebsite');

        /**
         * Task 13 Core: Function using async/await
         */
        async function fetchUserAsync() {
            fetchBtn.innerText = 'Await Processing...';
            fetchBtn.disabled = true;

            try {
                // Task 13 Requirement: Fetch data using async/await
                const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
                
                if (!response.ok) throw new Error("HTTP error " + response.status);
                
                const user = await response.json();

                // Task 13 Requirement: Log the user data to the console
                console.log('%c [Task 13] User Data Successfully Awaited:', 'color: #6366f1; font-weight: bold;', user);

                // Displaying results on web page
                updateUI(user);

            } catch (error) {
                // Task 13 Requirement: Handle any errors
                console.error("Async Error Caught:", error);
                alert("An error occurred during the async operation. Check console.");
            } finally {
                fetchBtn.innerText = 'Initialize Async Fetch';
                fetchBtn.disabled = false;
            }
        }

        function updateUI(user) {
            userName.innerText = user.name;
            userHandle.innerText = `@${user.username}`;
            userEmail.innerText = user.email;
            userCompany.innerText = user.company.name;
            userWebsite.innerText = user.website;
            avatar.innerText = user.name.charAt(0);
            
            outputArea.classList.remove('hidden');
            outputArea.style.animation = 'scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
        }

        fetchBtn.addEventListener('click', fetchUserAsync);
    </script>
</body>
</html>
