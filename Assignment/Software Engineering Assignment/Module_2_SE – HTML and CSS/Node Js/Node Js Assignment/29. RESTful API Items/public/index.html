<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Nexus | Task 29</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #08080a;
            --accent: #eab308;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: #fff; min-height: 100vh; padding: 4rem 1rem; }
        .container { width: 100%; max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 4rem; }
        .badge { display: inline-block; background: rgba(234, 179, 8, 0.1); color: var(--accent); padding: 5px 15px; border-radius: 100px; font-size: 0.7rem; font-weight: 800; letter-spacing: 3px; border: 1px solid rgba(234, 179, 8, 0.2); margin-bottom: 1rem; }
        h1 { font-size: 3.5rem; letter-spacing: -2px; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }

        /* Form Card */
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 32px; padding: 2.5rem; backdrop-filter: blur(20px); }
        .card h2 { font-size: 1.2rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; color: var(--accent); }
        
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.7rem; font-weight: 800; color: #64748b; letter-spacing: 1px; margin-bottom: 8px; }
        input { width: 100%; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); padding: 12px 18px; border-radius: 12px; color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.05); }

        .btn-main { width: 100%; background: var(--accent); color: #422006; border: none; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(234, 179, 8, 0.2); }

        /* Inventory List */
        .inventory-list { display: flex; flex-direction: column; gap: 1rem; }
        .item-card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .item-card:hover { border-color: rgba(255,255,255,0.2); transform: scale(1.01); }

        .item-info h4 { font-size: 1.1rem; color: #fff; }
        .item-info p { font-size: 0.75rem; color: #64748b; margin-top: 4px; }
        .item-stock { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 8px; margin-top: 8px; display: inline-block; }

        .actions { display: flex; gap: 10px; }
        .action-btn { background: none; border: 1px solid var(--border); color: #fff; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .action-btn:hover { background: rgba(255,255,255,0.05); border-color: #fff; }
        .action-btn.del:hover { background: rgba(244, 63, 94, 0.1); border-color: #f43f5e; color: #f43f5e; }

        @media (max-width: 800px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">RESTFUL_INVENTORY // CRUD_ENGINE</div>
            <h1>Inventory Nexus</h1>
        </header>

        <div class="dashboard-grid">
            <section class="card">
                <h2 id="formTitle"><i class="ph-bold ph-plus-circle"></i> Add New Asset</h2>
                <form id="itemForm">
                    <input type="hidden" id="itemId">
                    <div class="input-group">
                        <label>ASSET_NAME</label>
                        <input type="text" id="name" placeholder="e.g. Neural Processor" required>
                    </div>
                    <div class="input-group">
                        <label>CLASSIFICATION</label>
                        <input type="text" id="category" placeholder="e.g. Hardware" required>
                    </div>
                    <div class="input-group">
                        <label>STOCK_QUANTITY</label>
                        <input type="number" id="stock" placeholder="0" required>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-main">
                        <i class="ph-bold ph-lightning"></i>
                        <span>COMMIT ASSET</span>
                    </button>
                    <button type="button" id="cancelBtn" class="btn-main hidden" style="margin-top: 10px; background: none; border: 1px solid var(--border); color: #64748b;">
                        CANCEL_EDIT
                    </button>
                </form>
            </section>

            <section class="inventory-list" id="inventoryList">
                <!-- Items will be injected here -->
            </section>
        </div>
    </div>

    <script>
        const itemForm = document.getElementById('itemForm');
        const inventoryList = document.getElementById('inventoryList');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const formTitle = document.getElementById('formTitle');

        let isEditing = false;

        const fetchItems = async () => {
            const res = await fetch('/api/items');
            const items = await res.json();
            renderItems(items);
        };

        const renderItems = (items) => {
            inventoryList.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <p>${item.category}</p>
                        <span class="item-stock">UNIT_STOCK: ${item.stock}</span>
                    </div>
                    <div class="actions">
                        <button class="action-btn" onclick="editItem(${item.id}, '${item.name}', '${item.category}', ${item.stock})">
                            <i class="ph-bold ph-pencil-simple"></i>
                        </button>
                        <button class="action-btn del" onclick="deleteItem(${item.id})">
                            <i class="ph-bold ph-trash"></i>
                        </button>
                    </div>
                `;
                inventoryList.appendChild(card);
            });
        };

        itemForm.onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                stock: parseInt(document.getElementById('stock').value)
            };

            const url = isEditing ? `/api/items/${document.getElementById('itemId').value}` : '/api/items';
            const method = isEditing ? 'PUT' : 'POST';

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            resetForm();
            fetchItems();
        };

        window.deleteItem = async (id) => {
            if(confirm("Confirm asset decommissioning?")) {
                await fetch(`/api/items/${id}`, { method: 'DELETE' });
                fetchItems();
            }
        };

        window.editItem = (id, name, category, stock) => {
            isEditing = true;
            document.getElementById('itemId').value = id;
            document.getElementById('name').value = name;
            document.getElementById('category').value = category;
            document.getElementById('stock').value = stock;
            
            formTitle.innerHTML = '<i class="ph-bold ph-pencil-simple"></i> Edit Asset';
            submitBtn.innerHTML = '<i class="ph-bold ph-check"></i> UPDATE_ASSET';
            cancelBtn.classList.remove('hidden');
        };

        const resetForm = () => {
            isEditing = false;
            itemForm.reset();
            formTitle.innerHTML = '<i class="ph-bold ph-plus-circle"></i> Add New Asset';
            submitBtn.innerHTML = '<i class="ph-bold ph-lightning"></i> COMMIT ASSET';
            cancelBtn.classList.add('hidden');
        };

        cancelBtn.onclick = resetForm;

        fetchItems();
    </script>
</body>
</html>
