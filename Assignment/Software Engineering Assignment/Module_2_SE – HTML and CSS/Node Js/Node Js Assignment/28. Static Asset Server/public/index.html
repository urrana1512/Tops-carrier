<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Server | Task 28</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <div class="badge">Static Asset Distribution</div>
            <h1 id="mainHeading">Native Asset Server</h1>
            <p>Orchestrating HTML, CSS, and JS through a single Node.js stream.</p>
        </header>
        
        <div class="status-box">
            <div class="status-item">
                <span class="label">STATUS:</span>
                <span class="value" id="statusVal">Establishing Link...</span>
            </div>
            <div class="status-item">
                <span class="label">ENGINE:</span>
                <span class="value">Node.js Native HTTP</span>
            </div>
        </div>

        <button id="triggerBtn" class="glow-btn">Verify Script Integration</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
