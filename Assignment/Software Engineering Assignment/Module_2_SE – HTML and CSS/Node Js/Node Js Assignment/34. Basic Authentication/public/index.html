<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Access | Task 34</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #facc15;
            --glass: rgba(24, 24, 27, 0.8);
            --border: rgba(250, 204, 21, 0.2);
            --text: #71717a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }
        .container { width: 100%; max-width: 450px; text-align: center; }
        header { margin-bottom: 3rem; }
        .badge {
            display: inline-block;
            background: rgba(250, 204, 21, 0.1);
            color: var(--accent);
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; color: #fff; letter-spacing: -1px; }

        .auth-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .input-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--text); letter-spacing: 1px; margin-bottom: 8px; }
        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: rgba(0, 0, 0, 0.5); }

        .btn-auth {
            width: 100%;
            background: var(--accent);
            color: #422006;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            margin-top: 1rem;
        }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(250, 204, 21, 0.2); }

        .protected-area {
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: left;
            animation: fadeIn 0.5s ease;
        }
        .protected-area h3 { font-size: 0.8rem; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .protected-area p { font-size: 0.9rem; color: #fff; line-height: 1.6; }

        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">IDENTITY_VAULT // AUTH_GATE</div>
            <h1>Vault Access</h1>
        </header>

        <section class="auth-card" id="loginView">
            <div class="input-group">
                <label>CORE_USER (USERNAME)</label>
                <input type="text" id="username" placeholder="e.g. admin" value="admin">
            </div>
            <div class="input-group">
                <label>ACCESS_PHRASE (PASSWORD)</label>
                <input type="password" id="password" placeholder="••••••••" value="password123">
            </div>
            <button class="btn-auth" onclick="executeLogin()">
                <i class="ph-bold ph-key"></i>
                AUTHENTICATE
            </button>
        </section>

        <section class="protected-area hidden" id="protectedView">
            <h3><i class="ph-fill ph-lock-keyhole-open"></i> VAULT_DECRYPTED</h3>
            <p id="confidentialText"></p>
            <button class="btn-auth" onclick="logout()" style="background: none; border: 1px solid rgba(255,255,255,0.1); color: var(--text); margin-top: 20px;">
                SEVER_SESSION
            </button>
        </section>
    </div>

    <script>
        let sessionToken = null;

        const executeLogin = async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();

                if (data.status === "SUCCESS") {
                    sessionToken = data.token;
                    enterVault();
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert("Login portal link severed.");
            }
        };

        const enterVault = async () => {
            try {
                const response = await fetch('/api/protected', {
                    headers: { 'Authorization': sessionToken }
                });
                const data = await response.json();

                if (data.status === "SECURE") {
                    document.getElementById('loginView').classList.add('hidden');
                    document.getElementById('protectedView').classList.remove('hidden');
                    document.getElementById('confidentialText').innerText = data.confidentialData;
                } else {
                    alert("Vault clearance rejected.");
                }
            } catch (error) {
                alert("Vault link severed.");
            }
        };

        const logout = () => {
            sessionToken = null;
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('protectedView').classList.add('hidden');
        };
    </script>
</body>
</html>
