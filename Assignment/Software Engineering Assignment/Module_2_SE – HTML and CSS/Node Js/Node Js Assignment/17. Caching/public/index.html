<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cache Vault | API Optimization</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>
    
    <main class="container">
        <header>
            <div class="logo">⚡ CACHE_VAULT</div>
            <h1>Data Retrieval Protocol</h1>
            <p>Demonstrating Persistent API Caching</p>
        </header>

        <div class="controls">
            <button id="fetchBtn" class="primary-btn">Request Users Data</button>
            <button id="clearBtn" class="secondary-btn">Purge Cache</button>
        </div>

        <!-- Visual Feedback of Source -->
        <div id="sourceIndicator" class="source-indicator hidden">
            <span id="sourceLabel">PENDING</span>
        </div>

        <section id="output" class="output-area glass">
            <div class="placeholder">Awaiting Data Request...</div>
        </section>

        <div class="console glass">
            <div class="console-header">SYSTEM_LOG</div>
            <div id="consoleLog" class="console-body">
                > System initialized. Cache is ready.
            </div>
        </div>
    </main>

    <script>
        const fetchBtn = document.getElementById('fetchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const output = document.getElementById('output');
        const consoleLog = document.getElementById('consoleLog');
        const sourceIndicator = document.getElementById('sourceIndicator');
        const sourceLabel = document.getElementById('sourceLabel');

        const CACHE_KEY = 'jsonplaceholder_users_cache';

        function log(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="timestamp">${new Date().toLocaleTimeString()}</span> > ${msg}`;
            consoleLog.prepend(entry);
        }

        async function getData() {
            // Task 17 Requirement: Check if data is cached before making a new request
            const cachedData = localStorage.getItem(CACHE_KEY);

            if (cachedData) {
                log("Cache hit! Retrieving data from local storage.", "success");
                displayData(JSON.parse(cachedData), "LOADED FROM CACHE");
                return;
            }

            log("Cache miss. Initiating network request to API...", "warning");
            
            try {
                // Task 17 Requirement: Fetch data from JSONPlaceholder API
                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                const data = await response.json();

                // Task 17 Requirement: Store response data in local storage
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                log("Data received and stored in cache vault.", "success");

                displayData(data, "FETCHED FROM NETWORK");
            } catch (error) {
                log("Network request failed: " + error.message, "error");
                output.innerHTML = '<div class="error">Retrieval Failed. Check connection.</div>';
            }
        }

        function displayData(users, source) {
            sourceIndicator.classList.remove('hidden');
            sourceLabel.innerText = source;
            sourceLabel.className = source.includes('CACHE') ? 'cache-hit' : 'cache-miss';

            output.innerHTML = '';
            users.slice(0, 5).forEach(user => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <div class="user-avatar">${user.name.charAt(0)}</div>
                    <div class="user-info">
                        <strong>${user.name}</strong>
                        <span>${user.email}</span>
                    </div>
                `;
                output.appendChild(card);
            });
        }

        fetchBtn.addEventListener('click', getData);
        
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem(CACHE_KEY);
            log("Cache purged. System cleared.", "error");
            sourceIndicator.classList.add('hidden');
            output.innerHTML = '<div class="placeholder">Awaiting Data Request...</div>';
        });
    </script>
</body>
</html>
