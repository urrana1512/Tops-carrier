<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault Tolerance | Task 8</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #030712;
            --card: #111827;
            --accent: #ef4444;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: #1f2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 4rem 2rem;
            background-image: radial-gradient(circle at bottom left, #450a0a 0%, #030712 60%);
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        header { margin-bottom: 4rem; text-align: center; }
        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1.5px; }
        .monitor-icon { font-size: 3.5rem; color: var(--accent); margin-bottom: 1rem; opacity: 0.5; }

        /* Fault Card */
        .fault-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .btn-trigger {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 1.2rem;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            text-align: left;
        }
        .btn-trigger:hover { border-color: var(--accent); color: var(--accent); background: rgba(239, 68, 68, 0.05); }

        .terminal {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            min-height: 150px;
            color: var(--muted);
            transition: 0.3s;
            overflow-x: auto;
        }
        .terminal-active { border-color: var(--accent); color: var(--text); }
        .error-code { color: var(--accent); font-weight: 800; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <i class="ph-bold ph-warning-octagon monitor-icon"></i>
            <h1>Fault Tolerance</h1>
        </header>

        <section class="fault-card">
            <button class="btn-trigger" onclick="triggerError('/users/invalid-id-format')">
                <i class="ph-bold ph-database"></i>
                TRIGGER_DATABASE_FAULT (400/500)
            </button>
            
            <button class="btn-trigger" onclick="triggerError('/api/trigger-fault')">
                <i class="ph-bold ph-skull"></i>
                SIMULATE_SYSTEM_COLLAPSE (500)
            </button>

            <div class="terminal" id="terminal">// Awaiting fault interception...</div>
        </section>
    </div>

    <script>
        const terminal = document.getElementById('terminal');

        const triggerError = async (endpoint) => {
            terminal.className = 'terminal';
            terminal.innerText = `// Calling ${endpoint}...`;
            
            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                
                terminal.className = 'terminal terminal-active';
                terminal.innerHTML = `> EXCEPTION_INTERCEPTED<br><br><span class="error-code">HTTP_${data.error.code}</span><br><br><pre style="color:var(--muted)">${JSON.stringify(data, null, 2)}</pre>`;
            } catch (e) {
                terminal.innerText = "// Handshake failed: Check server connection.";
            }
        };
    </script>
</body>
</html>
