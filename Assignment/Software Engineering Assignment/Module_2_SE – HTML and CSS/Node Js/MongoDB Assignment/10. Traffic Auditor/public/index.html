<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Auditor | Task 10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #030712;
            --card: #111827;
            --accent: #38bdf8;
            --text: #f9fafb;
            --muted: #64748b;
            --border: #1e293b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 4rem 2rem;
            background-image: radial-gradient(circle at center, #082f49 0%, #030712 100%);
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        header { margin-bottom: 3rem; text-align: center; }
        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1.5px; }
        .meta { font-size: 0.7rem; color: var(--accent); font-weight: 800; letter-spacing: 2px; }

        /* Auditor Card */
        .auditor-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 32px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .btn-auditor {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1.2rem;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-auditor:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.02); }

        .log-terminal {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            min-height: 200px;
            color: var(--muted);
            overflow-y: auto;
        }
        .log-entry { margin-bottom: 12px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .timestamp { color: var(--accent); font-weight: 600; }
        .method { color: #f59e0b; font-weight: 800; }
        .url { color: var(--text); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="meta">OBSERVABILITY_LAYER // MIDDLEWARE</div>
            <h1>Traffic Auditor</h1>
        </header>

        <section class="auditor-card">
            <div class="btn-row">
                <button class="btn-auditor" onclick="pingServer('GET', '/api/ping')">
                    <i class="ph-bold ph-broadcast"></i> GET_PING
                </button>
                <button class="btn-auditor" onclick="pingServer('POST', '/api/data')">
                    <i class="ph-bold ph-database"></i> POST_DATA
                </button>
            </div>

            <div class="log-terminal" id="terminal">
                // Awaiting traffic telemetry...
            </div>
        </section>
    </div>

    <script>
        const terminal = document.getElementById('terminal');

        const pingServer = async (method, url) => {
            const startTime = Date.now();
            try {
                const res = await fetch(url, { method });
                const data = await res.json();
                
                if (terminal.innerText.includes('Awaiting')) terminal.innerHTML = '';
                
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `
                    <span class="timestamp">[${new Date().toLocaleTimeString()}]</span> 
                    <span class="method">${method}</span> 
                    <span class="url">${url}</span>
                    <br><span style="opacity:0.5; font-size:0.65rem">INGRESS_AUTHORIZED // LATENCY: ${Date.now() - startTime}ms</span>
                `;
                terminal.prepend(entry);
            } catch (e) {
                console.error(e);
            }
        };
    </script>
</body>
</html>
