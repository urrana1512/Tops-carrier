<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus User Registry | Task 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #030712;
            --card: #111827;
            --accent: #3b82f6;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: #1f2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 4rem 2rem;
            background-image: radial-gradient(circle at top left, #1e3a8a 0%, #030712 60%);
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { margin-bottom: 4rem; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -2px; }
        .db-status { font-size: 0.75rem; color: var(--accent); font-weight: 800; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }

        /* Form Card */
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 32px;
            margin-bottom: 3rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr) auto;
            gap: 1.5rem;
            align-items: end;
        }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 0.7rem; font-weight: 800; color: var(--muted); letter-spacing: 1px; }
        input {
            background: #030712;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent); }

        .btn-add {
            background: var(--accent);
            color: #fff;
            border: none;
            width: 50px; height: 50px;
            border-radius: 14px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .btn-add:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }

        /* Table/Grid Styling */
        .user-grid { display: grid; gap: 1rem; }
        .user-row {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 1.5rem 2rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.3s;
        }
        .user-row:hover { border-color: var(--accent); transform: translateX(10px); }
        
        .info .name { font-weight: 800; font-size: 1.1rem; display: block; }
        .info .email { color: var(--muted); font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; }
        
        .actions { display: flex; gap: 10px; }
        .btn-icon {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--muted);
            width: 40px; height: 40px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { color: var(--text); border-color: var(--accent); background: var(--accent); }
        .btn-del:hover { background: #ef4444; border-color: #ef4444; }

        .empty-state { padding: 4rem; text-align: center; color: var(--muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <div class="db-status"><div class="dot"></div> MONGODB_CONNECTED // STABLE</div>
                <h1>User Registry</h1>
            </div>
            <i class="ph-bold ph-database" style="font-size: 3rem; color: var(--accent); opacity: 0.3;"></i>
        </header>

        <section class="form-card">
            <div class="field">
                <label>FULL_NAME</label>
                <input type="text" id="nameInput" placeholder="John Doe">
            </div>
            <div class="field">
                <label>EMAIL_ADDRESS</label>
                <input type="email" id="emailInput" placeholder="john@nexus.com">
            </div>
            <div class="field">
                <label>ACCESS_KEY</label>
                <input type="password" id="passInput" placeholder="••••••••">
            </div>
            <button class="btn-add" onclick="createUser()">
                <i class="ph-bold ph-plus"></i>
            </button>
        </section>

        <div class="user-grid" id="userGrid">
            <!-- Dynamic Users -->
        </div>
    </div>

    <script>
        const API_URL = '/users';

        const fetchUsers = async () => {
            const res = await fetch(API_URL);
            const users = await res.json();
            const grid = document.getElementById('userGrid');
            
            if (users.length === 0) {
                grid.innerHTML = '<div class="empty-state">No identities found in the cluster.</div>';
                return;
            }

            grid.innerHTML = users.map(user => `
                <div class="user-row">
                    <div class="info">
                        <span class="name">${user.name}</span>
                        <span class="email">${user.email}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-icon" onclick="updateUser('${user._id}')"><i class="ph ph-pencil-simple"></i></button>
                        <button class="btn-icon btn-del" onclick="deleteUser('${user._id}')"><i class="ph ph-trash"></i></button>
                    </div>
                </div>
            `).join('');
        };

        const createUser = async () => {
            const name = document.getElementById('nameInput').value;
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passInput').value;

            if (!name || !email || !password) return;

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });

            if (res.ok) {
                document.getElementById('nameInput').value = '';
                document.getElementById('emailInput').value = '';
                document.getElementById('passInput').value = '';
                fetchUsers();
            } else {
                const err = await res.json();
                alert(`Error: ${err.message}`);
            }
        };

        const updateUser = async (id) => {
            const newName = prompt("Enter synchronized name:");
            if (newName) {
                await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                });
                fetchUsers();
            }
        };

        const deleteUser = async (id) => {
            if (confirm("Purge identity from cluster?")) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchUsers();
            }
        };

        fetchUsers();
    </script>
</body>
</html>
