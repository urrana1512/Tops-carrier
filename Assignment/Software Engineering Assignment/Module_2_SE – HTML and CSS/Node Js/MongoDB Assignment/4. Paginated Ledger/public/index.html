<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paginated Ledger | Task 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #030712;
            --card: #111827;
            --accent: #f59e0b;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: #1f2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 4rem 2rem;
            background-image: radial-gradient(circle at top left, #451a03 0%, #030712 60%);
            min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; }
        
        header { margin-bottom: 4rem; display: flex; justify-content: space-between; align-items: flex-end; }
        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1.5px; }
        .meta { font-size: 0.7rem; color: var(--accent); font-weight: 800; letter-spacing: 2px; }

        /* Ledger Table */
        .ledger-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .user-row {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
        }
        .user-row:last-child { border-bottom: none; }
        .user-row:hover { background: rgba(255, 255, 255, 0.02); }
        
        .user-info .name { font-weight: 600; font-size: 1rem; display: block; }
        .user-info .email { color: var(--muted); font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; }

        /* Pagination Controls */
        .controls {
            padding: 1.5rem 2rem;
            background: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
        }
        .page-info { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
        .nav-btns { display: flex; gap: 10px; }
        
        .btn-nav {
            background: #030712;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-nav:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <div class="meta">WINDOWED_LEDGER // PAGINATION</div>
                <h1>Nexus Registry</h1>
            </div>
            <div id="itemCount" class="meta" style="color: var(--muted)">TOTAL: 0</div>
        </header>

        <div class="ledger-box">
            <div id="userList">
                <!-- Dynamic Rows -->
            </div>
            
            <div class="controls">
                <div class="page-info" id="pageLabel">PAGE 1 OF 1</div>
                <div class="nav-btns">
                    <button class="btn-nav" id="prevBtn" onclick="changePage(-1)">
                        <i class="ph-bold ph-arrow-left"></i> PREV
                    </button>
                    <button class="btn-nav" id="nextBtn" onclick="changePage(1)">
                        NEXT <i class="ph-bold ph-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const limit = 5;

        const fetchLedger = async (page) => {
            const res = await fetch(`/users?page=${page}&limit=${limit}`);
            const result = await res.json();
            
            const list = document.getElementById('userList');
            const pageLabel = document.getElementById('pageLabel');
            const itemCount = document.getElementById('itemCount');
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');

            list.innerHTML = result.data.map(user => `
                <div class="user-row">
                    <div class="user-info">
                        <span class="name">${user.name}</span>
                        <span class="email">${user.email}</span>
                    </div>
                    <i class="ph ph-caret-right" style="color: var(--border)"></i>
                </div>
            `).join('');

            const meta = result.metadata;
            pageLabel.innerText = `PAGE ${meta.currentPage} OF ${meta.totalPages}`;
            itemCount.innerText = `TOTAL_SEGMENTS: ${meta.totalItems}`;
            
            prevBtn.disabled = meta.currentPage === 1;
            nextBtn.disabled = meta.currentPage === meta.totalPages;
            
            currentPage = meta.currentPage;
        };

        const changePage = (offset) => {
            fetchLedger(currentPage + offset);
        };

        // Initial Load
        fetchLedger(1);
    </script>
</body>
</html>
