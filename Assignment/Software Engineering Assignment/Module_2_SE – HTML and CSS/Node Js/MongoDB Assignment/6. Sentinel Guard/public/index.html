<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Guard | Task 6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #030712;
            --card: #111827;
            --accent: #6366f1;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: #1f2937;
            --error: #ef4444;
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 4rem 2rem;
            background-image: radial-gradient(circle at bottom right, #312e81 0%, #030712 60%);
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        header { margin-bottom: 4rem; text-align: center; }
        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1.5px; }
        .shield-icon { font-size: 3.5rem; color: var(--accent); margin-bottom: 1rem; }

        /* Guard Card */
        .guard-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.7rem; font-weight: 800; color: var(--muted); letter-spacing: 1px; }
        input {
            background: #030712; border: 1px solid var(--border); padding: 14px 18px; border-radius: 12px;
            color: #fff; font-family: inherit; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); }

        .btn-action {
            padding: 1rem; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px; border: none;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
        .btn-outline:hover { border-color: var(--accent); color: var(--text); }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .monitor {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; min-height: 100px; color: var(--muted);
            transition: 0.3s;
        }
        .monitor-active { color: var(--text); border-color: var(--accent); }
        .error-text { color: var(--error); }
        .success-text { color: var(--success); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <i class="ph-bold ph-shield-checkered shield-icon"></i>
            <h1>Sentinel Guard</h1>
        </header>

        <section class="guard-card">
            <div class="input-group">
                <label>AUTH_IDENTITY_EMAIL</label>
                <input type="email" id="emailInput" placeholder="admin@guard.io">
            </div>

            <button class="btn-action btn-primary" onclick="requestToken()">
                <i class="ph-bold ph-key"></i>
                SYNTHESIZE_BEARER_TOKEN
            </button>

            <div style="border-top: 1px solid var(--border); margin: 0.5rem 0;"></div>

            <button class="btn-action btn-outline" onclick="accessProtectedRoute()">
                <i class="ph-bold ph-lock-keyhole"></i>
                PROBE_PROTECTED_REGISTRY
            </button>

            <div class="monitor" id="monitor">// Awaiting authorization protocol...</div>
        </section>
    </div>

    <script>
        let bearerToken = null;
        const monitor = document.getElementById('monitor');

        const requestToken = async () => {
            const email = document.getElementById('emailInput').value || 'guest@sentinel.io';
            const res = await fetch('/api/auth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            bearerToken = data.token;
            
            monitor.className = 'monitor monitor-active';
            monitor.innerHTML = `<span class="success-text">> TOKEN_GENERATED</span><br><br>${bearerToken}`;
        };

        const accessProtectedRoute = async () => {
            monitor.className = 'monitor';
            monitor.innerText = "// Probing /users registry...";
            
            try {
                const res = await fetch('/users', {
                    headers: { 'Authorization': bearerToken ? `Bearer ${bearerToken}` : '' }
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    monitor.className = 'monitor monitor-active';
                    monitor.innerHTML = `<span class="success-text">> ACCESS_GRANTED</span><br><b>USER:</b> ${data.accessibleBy}<br><br><pre style="color:var(--muted)">${JSON.stringify(data.data, null, 2)}</pre>`;
                } else {
                    monitor.className = 'monitor monitor-active';
                    monitor.innerHTML = `<span class="error-text">> ACCESS_DENIED</span><br><b>CODE:</b> ${res.status}<br><b>MSG:</b> ${data.message}`;
                }
            } catch (e) {
                monitor.innerText = "// Handshake error.";
            }
        };
    </script>
</body>
</html>
