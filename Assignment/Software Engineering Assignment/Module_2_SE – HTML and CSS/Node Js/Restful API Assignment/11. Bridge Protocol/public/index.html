<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Protocol | Task 11</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #f472b6;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(244, 114, 182, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at top left, #500724 0%, #000 60%);
        }
        .container { width: 100%; max-width: 600px; text-align: center; }
        header { margin-bottom: 3.5rem; }
        .badge {
            display: inline-block;
            background: rgba(244, 114, 182, 0.1);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 3px;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        h1 { font-size: 3.5rem; letter-spacing: -2px; }

        .bridge-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 40px;
            backdrop-filter: blur(20px);
            text-align: center;
        }

        .status-display {
            background: #000;
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
        }
        .status-line { margin-bottom: 10px; font-size: 0.8rem; color: #64748b; }
        .status-line b { color: var(--accent); }

        .btn-test {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.3s;
        }
        .btn-test:hover { transform: scale(1.02); box-shadow: 0 10px 30px rgba(244, 114, 182, 0.3); }

        #responseArea {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 16px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #f472b6;
            display: none;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">CORS_PROTOCOL // INTER_DOMAIN_HANDSHAKE</div>
            <h1>Bridge Protocol</h1>
        </header>

        <section class="bridge-card">
            <div class="status-display">
                <div class="status-line">POLICY: <b>ALLOW_ALL</b></div>
                <div class="status-line">ENDPOINT: <b>/api/cross-handshake</b></div>
                <div class="status-line">STATUS: <b>SYNCHRONIZED</b></div>
            </div>

            <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 2rem;">Executing the handshake below will verify if the CORS headers are successfully injected by the Express engine.</p>

            <button class="btn-test" onclick="testBridge()">
                <i class="ph-bold ph-git-branch"></i>
                EXECUTE_CROSS_HANDSHAKE
            </button>

            <div id="responseArea"></div>
        </section>
    </div>

    <script>
        const respArea = document.getElementById('responseArea');

        const testBridge = async () => {
            respArea.style.display = 'block';
            respArea.innerText = "// Handshaking across domains...";
            
            try {
                const res = await fetch('/api/cross-handshake');
                const data = await res.json();
                respArea.innerHTML = `<div style="color:#64748b;">> RESPONSE_CAPTURED</div><pre style="margin-top:10px;">${JSON.stringify(data, null, 2)}</pre>`;
            } catch (e) {
                respArea.innerText = "// Bridge Severed: CORS policy denied access.";
            }
        };
    </script>
</body>
</html>
