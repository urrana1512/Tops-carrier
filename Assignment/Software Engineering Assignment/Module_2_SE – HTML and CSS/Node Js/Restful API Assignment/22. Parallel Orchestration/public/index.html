<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Orchestration | Task 22</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #111827;
            --hover: #f9fafb;
            --sync: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 4rem 2rem;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 600px; margin: 0 auto; text-align: center; }
        
        header { margin-bottom: 4rem; }
        h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.025em; margin-bottom: 0.5rem; }
        p.subtitle { color: var(--muted); font-size: 0.9rem; font-weight: 300; }

        .parallel-card {
            background: white;
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 16px;
            text-align: center;
        }
        
        .sync-tracker { display: flex; justify-content: space-around; margin-bottom: 2.5rem; }
        .packet {
            display: flex; flex-direction: column; gap: 8px;
            color: var(--muted); font-size: 0.7rem; font-weight: 600;
        }
        .packet i { font-size: 1.5rem; transition: 0.3s; }
        .packet-active i { color: var(--sync); transform: scale(1.2); }
        .packet-done i { color: var(--sync); }

        .btn-trigger {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 2rem;
        }
        .btn-trigger:hover { transform: translateY(-2px); opacity: 0.9; }

        .monitor {
            background: var(--hover);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--muted);
            min-height: 120px;
        }
        .monitor-active { color: var(--text); border-color: var(--sync); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Parallel Orchestration</h1>
            <p class="subtitle">Executing concurrent asynchronous operations via Promise.all().</p>
        </header>

        <section class="parallel-card">
            <div class="sync-tracker">
                <div class="packet" id="p1"><i class="ph ph-package"></i>PACKET_1</div>
                <div class="packet" id="p2"><i class="ph ph-package"></i>PACKET_2</div>
                <div class="packet" id="p3"><i class="ph ph-package"></i>PACKET_3</div>
            </div>

            <button class="btn-trigger" id="testBtn" onclick="runParallelSync()">
                <i class="ph-bold ph-lightning"></i>
                EXECUTE_PARALLEL_SYNC
            </button>

            <div class="monitor" id="logMonitor">// Awaiting orchestration trigger...</div>
        </section>
    </div>

    <script>
        const monitor = document.getElementById('logMonitor');
        const p1 = document.getElementById('p1');
        const p2 = document.getElementById('p2');
        const p3 = document.getElementById('p3');
        const btn = document.getElementById('testBtn');

        const runParallelSync = async () => {
            btn.disabled = true;
            [p1, p2, p3].forEach(p => p.className = 'packet packet-active');
            monitor.innerText = "// Initiating Promise.all() handshake...";
            
            try {
                const res = await fetch('/api/parallel-sync');
                const data = await res.json();
                
                [p1, p2, p3].forEach(p => p.className = 'packet packet-done');
                monitor.className = 'monitor monitor-active';
                monitor.innerHTML = `> CONCURRENT_SYNC_COMPLETE (${data.duration_ms}ms)<br><br><pre style="color:var(--muted)">${JSON.stringify(data.results, null, 2)}</pre>`;
            } catch (e) {
                monitor.innerText = "// Orchestration severed.";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
