<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Logger | Task 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #facc15;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(250, 204, 21, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 100% 0%, #422006 0%, #000 60%);
        }
        .container { width: 100%; max-width: 600px; text-align: center; }
        header { margin-bottom: 3.5rem; }
        .badge {
            display: inline-block;
            background: rgba(250, 204, 21, 0.1);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 3px;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        h1 { font-size: 3.5rem; letter-spacing: -2px; }

        .logger-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3.5rem;
            border-radius: 40px;
            backdrop-filter: blur(20px);
            text-align: center;
        }

        .btn-group { display: grid; gap: 1rem; }
        .btn-trigger {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 16px;
            color: var(--accent);
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.3s;
        }
        .btn-trigger:hover { background: var(--accent); color: #422006; transform: translateY(-3px); }

        #terminalLog {
            margin-top: 2.5rem;
            background: #000;
            padding: 1.5rem;
            border-radius: 20px;
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #64748b;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">MIDDLEWARE_AUDIT // INGRESS_SENTINEL</div>
            <h1>Traffic Logger</h1>
        </header>

        <section class="logger-card">
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 2rem;">Trigger the endpoints below to observe real-time audit telemetry in your terminal console.</p>
            
            <div class="btn-group">
                <button class="btn-trigger" onclick="triggerPing()">
                    <i class="ph-bold ph-broadcast"></i>
                    TRIGGER_PING_ENDPOINT
                </button>
                <button class="btn-trigger" onclick="triggerResource()">
                    <i class="ph-bold ph-database"></i>
                    TRIGGER_RESOURCE_FETCH
                </button>
            </div>

            <div id="terminalLog">// Awaiting signal transmission...</div>
        </section>
    </div>

    <script>
        const log = document.getElementById('terminalLog');

        const triggerPing = async () => {
            log.innerText = "// Dispatching PING signal...";
            const res = await fetch('/api/ping');
            const data = await res.json();
            log.innerText = `// RECEIVED: ${data.message}\n// Check your terminal for the audit log.`;
        };

        const triggerResource = async () => {
            log.innerText = "// Fetching operational data...";
            const res = await fetch('/api/resource');
            const data = await res.json();
            log.innerText = `// RECEIVED: ${data.data}\n// Check your terminal for the audit log.`;
        };
    </script>
</body>
</html>
