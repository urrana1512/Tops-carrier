<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagination Engine | Task 10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #a855f7;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(168, 85, 247, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 0% 100%, #2e1065 0%, #000 60%);
        }
        .container { width: 100%; max-width: 700px; text-align: center; }
        header { margin-bottom: 3rem; }
        .badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.1);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 3px;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        h1 { font-size: 3.5rem; letter-spacing: -2px; }

        .nexus-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2.5rem;
            border-radius: 40px;
            backdrop-filter: blur(20px);
            text-align: left;
        }

        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .meta-info { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #64748b; }
        .meta-info b { color: var(--accent); }

        .asset-list { display: grid; gap: 10px; min-height: 400px; }
        .asset-item {
            background: rgba(255,255,255,0.02);
            padding: 15px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.03);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .asset-item .name { font-weight: 800; }
        .asset-item .code { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #444; }

        .pagination-ctrl {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin-top: 2.5rem;
        }
        .btn-page {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-page:not(:disabled):hover { background: var(--accent); color: #fff; transform: translateY(-3px); }
        .btn-page:disabled { opacity: 0.2; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">DATA_SLICE // VIEWPORT_SYNC</div>
            <h1>Pagination Node</h1>
        </header>

        <section class="nexus-card">
            <div class="meta-bar">
                <div class="meta-info">REGISTRY_SIZE: <b id="totalItems">0</b></div>
                <div class="meta-info">VIEWPORT: <b id="currentPage">1</b> / <b id="totalPages">1</b></div>
            </div>

            <div class="asset-list" id="assetContainer">
                <!-- Data injected here -->
            </div>

            <div class="pagination-ctrl">
                <button class="btn-page" id="prevBtn" onclick="changePage(-1)">
                    <i class="ph-bold ph-arrow-left"></i> PREV
                </button>
                <button class="btn-page" id="nextBtn" onclick="changePage(1)">
                    NEXT <i class="ph-bold ph-arrow-right"></i>
                </button>
            </div>
        </section>
    </div>

    <script>
        let current = 1;
        const limit = 8;

        const syncViewport = async (page) => {
            const res = await fetch(`/api/items?page=${page}&limit=${limit}`);
            const data = await res.json();
            const meta = data.metadata;

            document.getElementById('totalItems').innerText = meta.total_items;
            document.getElementById('currentPage').innerText = meta.current_page;
            document.getElementById('totalPages').innerText = meta.total_pages;

            document.getElementById('prevBtn').disabled = !meta.has_prev;
            document.getElementById('nextBtn').disabled = !meta.has_next;

            const container = document.getElementById('assetContainer');
            container.innerHTML = data.data.map(item => `
                <div class="asset-item">
                    <span class="name">${item.name}</span>
                    <span class="code">${item.code}</span>
                </div>
            `).join('');
        };

        const changePage = (delta) => {
            current += delta;
            syncViewport(current);
        };

        syncViewport(current);
    </script>
</body>
</html>
