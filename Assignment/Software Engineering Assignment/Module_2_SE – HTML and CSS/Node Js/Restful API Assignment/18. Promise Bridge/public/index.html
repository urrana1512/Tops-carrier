<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Bridge | Task 18</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #6366f1;
            --hover: #f9fafb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 4rem 2rem;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 600px; margin: 0 auto; text-align: center; }
        
        header { margin-bottom: 4rem; }
        h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.025em; margin-bottom: 0.5rem; }
        p.subtitle { color: var(--muted); font-size: 0.9rem; font-weight: 300; }

        .promise-card {
            background: white;
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 16px;
            text-align: center;
        }
        
        .btn-trigger {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 2rem;
        }
        .btn-trigger:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }

        .monitor {
            background: var(--hover);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--muted);
            min-height: 120px;
        }
        .monitor-active { color: var(--text); border-color: var(--accent); }
        
        .loader { display: none; margin: 0 auto 1rem; color: var(--accent); animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Promise Bridge</h1>
            <p class="subtitle">Linearizing asynchronous control flow with ES6 Promises.</p>
        </header>

        <section class="promise-card">
            <button class="btn-trigger" id="testBtn" onclick="resolvePromise()">
                <i class="ph-bold ph-link-simple"></i>
                RESOLVE_PROMISE
            </button>

            <div class="monitor" id="logMonitor">
                <i class="ph-bold ph-circle-notch loader" id="loader"></i>
                // Awaiting promise construction...
            </div>
        </section>
    </div>

    <script>
        const monitor = document.getElementById('logMonitor');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('testBtn');

        const resolvePromise = async () => {
            btn.disabled = true;
            loader.style.display = 'block';
            monitor.innerHTML = '<i class="ph-bold ph-circle-notch loader" id="loader" style="display:block"></i>// Promise state: PENDING<br>// Waiting for resolution (2s delay)';
            
            try {
                const res = await fetch('/api/promise-handshake');
                const data = await res.json();
                
                monitor.className = 'monitor monitor-active';
                monitor.innerHTML = `> PROMISE_RESOLVED<br><br><pre style="color:var(--muted)">${JSON.stringify(data, null, 2)}</pre>`;
            } catch (e) {
                monitor.innerText = "// Connection severed.";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
