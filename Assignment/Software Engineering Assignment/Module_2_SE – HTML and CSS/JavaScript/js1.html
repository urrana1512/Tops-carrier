<!-- 1) Find Area And Circumference of Circle in javascript.  -->
<!DOCTYPE html>
<html>
  <head>
    <title>Circle Calculator</title>
  </head>
  <body>
    <h2>Calculate Area And Circumference Of A Circle</h2>

    <label>Enter Radius: </label>
    <input type="number" id="radiusInput" placeholder="Enter Radius" />
    <button onclick="calculateCircle()">Calculate</button>

    <p id="output"></p>

    <script>
      function calculateCircle() {
        const radius = parseFloat(document.getElementById("radiusInput").value);
        const pi = Math.PI;

        if (isNaN(radius) || radius <= 0) {
          document.getElementById("output").innerHTML =
            "Please Enter A Valid Positive Number.";
          return;
        }

        const area = pi * radius * radius;
        const circumference = 2 * pi * radius;

        document.getElementById("output").innerHTML =
          "Radius: " +
          radius +
          "<br>" +
          "Area: " +
          area.toFixed(2) +
          "<br>" +
          "Circumference: " +
          circumference.toFixed(2);
      }
    </script>
  </body>
</html>
