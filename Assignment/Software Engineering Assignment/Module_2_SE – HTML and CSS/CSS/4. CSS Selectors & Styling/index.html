<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="row">
      <div class="col-1"></div>

      <!-- Contact Form Start -->
      <div class="col-10 contact-form">
        <div class="row">
          <div class="col-6 form-info">
            <div class="row">
              <div class="col-12 header">
                <h1>Contact Us</h1>
                <p>
                  or reach out manually to <a href="">urrana1512@gmail.com</a>
                </p>
              </div>
              <div class="col-12">
                <img src="TW_Contact_Us-removebg-preview.png" alt="" />
              </div>
            </div>
          </div>
          <div class="col-6 form">
            <form action="" method="post">
              <label for="email">Email Address </label><br />
              <input type="email" name="email" id="" />
              <p class="small">
                We will never share your email with anyone else
              </p>
              <br />
              <label for="name">Your Name</label><br />
              <input type="text" name="name" id="" />

              <label for="message">Your Message</label><br />
              <textarea name="message" id="" rows="6"></textarea><br />

              <input
                type="submit"
                name="send"
                id=""
                value="Send Message"
                class="btn-submit"
              />
            </form>
          </div>
        </div>
      </div>
      <!-- Contact Form End -->

      <div class="col-1"></div>
    </div>
  </body>
</html>
